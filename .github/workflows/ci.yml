name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build y pruebas
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore MathTutor.slnx --nologo

      - name: Compilar Release sin advertencias
        run: dotnet build MathTutor.slnx -c Release --no-restore --nologo /p:TreatWarningsAsErrors=true

      - name: Ejecutar pruebas
        run: dotnet test tests\MathTutor.Tests\MathTutor.Tests.csproj -c Release --no-build --nologo --logger "trx;LogFileName=test-results.trx" --results-directory artifacts\test-results

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  package:
    name: Paquete Windows
    if: github.event_name == 'workflow_dispatch'
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar paquete
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\publish-winui.ps1

      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: MathTutor-Windows
          path: artifacts/releases/*.zip
          if-no-files-found: error
